<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>King Core</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: transparent; color: #f5f1e8; }
    .panel { width: 440px; padding: 26px; border: 1px solid #8c7040; border-radius: 12px; background: linear-gradient(145deg, rgba(31,29,27,.98), rgba(16,19,22,.98)); box-shadow: 0 18px 60px #000a; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 17px; border-bottom: 1px solid #ffffff20; }
    h1 { margin: 0; color: #e7c777; font-size: 25px; letter-spacing: 1px; }
    .hint { margin-top: 5px; color: #aaa49a; font-size: 12px; }
    button { border: 1px solid #ffffff30; border-radius: 6px; background: #ffffff0c; color: #ddd; padding: 6px 10px; cursor: pointer; }
    h2 { margin: 20px 0 10px; color: #bbb2a1; font-size: 12px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; }
    .row { display: flex; align-items: center; gap: 13px; padding: 12px 10px; border-bottom: 1px solid #ffffff12; }
    .row:last-child { border-bottom: 0; }
    .mark { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 50%; font-weight: 800; font-size: 15px; }
    .on .mark { color: #9df0ad; background: #1e633740; }
    .off .mark { color: #ff8e8e; background: #762f3740; }
    .name { font-size: 15px; }
    .state { margin-left: auto; color: #aaa49a; font-size: 12px; }
  </style>
</head>
<body>
  <main class="panel" aria-label="King Core mod status">
    <header><div><h1>King Core</h1><div class="hint">Mod integration status · Shift + K</div></div><button onclick="window.kcClose && window.kcClose()">Close</button></header>
    <h2>Compatible mods</h2>
    <section id="mods">
      <div class="row off" data-mod="classBound"><span class="mark">×</span><span class="name">ClassBound</span><span class="state">Not detected</span></div>
      <div class="row off" data-mod="followerUnbound"><span class="mark">×</span><span class="name">Follower Unbound</span><span class="state">Not detected</span></div>
      <div class="row off" data-mod="soulKeeper"><span class="mark">×</span><span class="name">SoulKeeper</span><span class="state">Not detected</span></div>
      <div class="row off" data-mod="lifeAgain"><span class="mark">×</span><span class="name">Life Again</span><span class="state">Not detected</span></div>
    </section>
  </main>
  <script>
    window.kcUpdateState = state => {
      document.querySelectorAll('[data-mod]').forEach(row => {
        const active = Boolean(state[row.dataset.mod]);
        row.classList.toggle('on', active);
        row.classList.toggle('off', !active);
        row.querySelector('.mark').textContent = active ? '✓' : '×';
        row.querySelector('.state').textContent = active ? 'Connected' : 'Not detected';
      });
    };
  </script>
</body>
</html>
